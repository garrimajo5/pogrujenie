name: Тесты
# Браузерная версия в архиве (archive/web), её тесты в CI больше не идут.
# Здесь — быстрые проверки репозитория Unity без редактора; сами тесты Unity — в «Unity».
on:
  pull_request:
  push:
    branches: [main]
jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unity .meta и файлы проекта
        run: python tools/test_unity_meta.py
      - name: Модели художника совпадают с исходниками в models/
        run: |
          pip install pillow
          python tools/glb_to_unity.py --check
