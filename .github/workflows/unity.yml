name: Unity
on:
  pull_request:
    paths: ['unity/**', '.github/workflows/unity.yml']
  push:
    branches: [main]
    paths: ['unity/**', '.github/workflows/unity.yml']
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.6.6f1

jobs:
  tests:
    name: Тесты Unity (EditMode и PlayMode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # unity-test-runner публикует результаты тестов отдельной проверкой
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-tests-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-tests-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          artifactsPath: artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts/tests

  android:
    name: Сборка APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # релиз apk-latest: ссылка на свежий APK для телефона
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          # v2: старый кэш Library (18:12) ронял редактор сразу после запуска (exit 137) — начинаем с чистого
          # v3: в репозитории появились .meta с постоянными GUID, Library со старыми GUID снова роняла редактор (exit 137)
          # v4: и Library от прошлой версии ассетов (restore-keys) роняет редактор при втором запуске (exit 137, main bbc0acb),
          #     поэтому берём кэш только при точном совпадении, иначе собираем Library заново
          key: Library-android-v4-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Pogrujenie.EditorTools.BuildScript.BuildAndroid
          buildName: Pogrujenie
          versioning: Custom
          version: 0.1.0
          androidVersionCode: 1
          androidExportType: androidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: pogrujenie-apk
          path: build/Android
          retention-days: 14
      # Свежий APK из main — в релиз apk-latest: постоянная ссылка, телефон качает без входа в GitHub и без zip
      - name: APK в релиз apk-latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk=$(find build/Android -name '*.apk' | head -1)
          test -n "$apk"
          cp "$apk" Pogrujenie.apk
          notes="Сборка из main, коммит ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC. Установка: скачать Pogrujenie.apk на телефоне и открыть."
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --prerelease --title "APK для телефона" --notes "$notes" --target "$GITHUB_SHA"
          gh release upload apk-latest Pogrujenie.apk --clobber
          gh release edit apk-latest --notes "$notes"
      # Файлы проекта, которые Unity создаёт при сборке (отчёт qa/2026-10-19-0150-unity-shader-fix):
      # отсюда их берём в репозиторий, чтобы сборки в CI и у тестера совпадали
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-project-files
          path: |
            unity/Packages/packages-lock.json
            unity/ProjectSettings/*.asset
          if-no-files-found: warn
          retention-days: 14
